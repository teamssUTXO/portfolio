name: Deployment

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # TEMP: inspect what the FTP account sees, remove once deploy target is confirmed
      - name: Debug FTP tree
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          ftp() { curl -s --ssl-reqd -k --user "$FTP_USERNAME:$FTP_PASSWORD" "$@"; }
          echo "=== absolute root / ==="
          ftp "ftp://$FTP_SERVER/%2F" -l || echo "(not found)"
          echo "=== login dir: _next/static/chunks/ ==="
          ftp "ftp://$FTP_SERVER/_next/static/chunks/" -l || echo "(not found)"
          echo "=== login dir: index.html date ==="
          ftp -I "ftp://$FTP_SERVER/index.html" | grep -i last-modified || true
          echo "=== login dir: index.html issuer ==="
          ftp "ftp://$FTP_SERVER/index.html" | grep -o '[A-Z]*<!-- --> · <!-- -->Expected' || true

      - name: FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: /public_html/
